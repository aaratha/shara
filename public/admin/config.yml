# disable in production:  
local_backend: false 
# command to run a local Decap instance: npx-decap-server

backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)

media_folder: "public/upload"
public_folder: "/"

site_url: https://sailsnake-decapcms.netlify.app

media_library:
  name: cloudinary
  # output_filename_only: true
  config:
    cloud_name: ittlbjso
    api_key: 737259485678325 


# SEO anchor:
seo: &seo
  name: "SEOmetaData"
  label: "SEO"
  widget: "object"
  collapsed: true
  fields: 
    - { name: "metaTitle", label: "SEO Title", widget: "string", default: "{{ title }}", required: true }
    - { name: "metaDescription", label: "SEO Description", widget: "string", pattern: [".{20,160}", "between 20 and 160 characters"], required: true, hint: "must be between 20 and 160 characters" }
    - { name: "metaImage", label: "SEO image", widget: "image"}
    - { name: "keywords", label: "keywords", widget: "string", hint: "keywords are comma seperated", required: false }



# Dynamic fields anchors. These define the reusable editor blocks below.
dfImages: &dfImages
  name: "images"
  label: "Images"
  widget: "image"
  choose_url: true
  media_library:
    config:
      multiple: true

dfImage: &dfImage
  name: "image"
  label: "Image"
  widget: "image"
  choose_url: true
  media_library:
    config:
      multiple: false

dfVideo: &dfVideo
  name: "video"
  label: "Video"
  widget: "file"
  choose_url: true
  media_library:
    config:
      multiple: false

dfAudio: &dfAudio
  name: "audio"
  label: "Audio"
  widget: "file"
  choose_url: true
  media_library:
    config:
      multiple: false

dfText: &dfText
  name: "dfText"
  label: "Text"
  widget: "markdown"

dfSettings: &dfSettings
  name: "dfSettings"
  label: "Settings"
  widget: "object"
  required: true
  fields:
    - { name: "size", label: "Size", widget: "select", options: ["small", "large"] }
    - { name: "background", label: "Background", widget: "select", options: ["dark", "light"] }

dynamicFields: &dynamicFields
  name: "dynamicField"
  label: "Content blocks"
  widget: "list"
  required: true
  types:
    - name: "text"
      label: "Text"
      widget: "object"
      fields:
        - *dfText
    - name: "image"
      label: "Single image"
      widget: "object"
      fields:
        - *dfImage
    - name: "images"
      label: "Image gallery"
      widget: "object"
      fields:
        - *dfImages
        - { name: "displayType", label: "Display", widget: "select", options: ["carousel", "lightbox"], default: "carousel" }
    - name: "video"
      label: "Video"
      widget: "object"
      fields:
        - *dfVideo
        - { name: "autoplay", label: "Autoplay", widget: "boolean", default: false }
        - { name: "muted", label: "Muted", widget: "boolean", default: false }
        - { name: "loop", label: "Loop", widget: "boolean", default: false }
    - name: "audio"
      label: "Audio"
      widget: "object"
      fields:
        - *dfAudio

collections:
  - name: "globalContent"
    label: "global content"
    files: 
      - label: "buttons"
        name: "buttons"
        file: "content/site/buttons.md"    
        fields: 
          - label: "next"
            name: "next"
            widget: "string"        
          - label: "previous"
            name: "previous"
            widget: "string"        
          - label: "close"
            name: "close"
            widget: "string"        
          - label: "article: more"
            name: "article"
            widget: "string"
            default: "read more"
          - label: "form: send"
            name: "send"
            widget: "string"
        
  # SINGLE PAGES
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/pages/home.md"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "content", label: "Content", widget: "markdown" }
          - *seo
      - name: "typography"
        label: "Typography"
        file: "content/pages/typography.md"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "content", label: "Content", widget: "markdown" }
      - name: "dynamicFields"
        label: "Dynamic Fields"
        file: "content/pages/dynamic-fields.md"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - name: "sections"
            label: "Sections"
            widget: "list"
            label_singular: "Section"
            fields:
              - { name: "name", label: "Section name", widget: "string" }
              - *dynamicFields
              - *dfSettings
          - *seo
      - name: "Fiddly diddlies"
        label: "diddlies"
        extension: json
        file: "content/pages/fiddly-diddlies.json"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "test-fields", label: "field objects test", widget: "string", default: "fields.title" }
          - { name: "content", label: "Content", widget: "markdown" }
     

          
