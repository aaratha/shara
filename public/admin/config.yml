backend:
  name: git-gateway
  branch: main

media_folder: "public/upload"
public_folder: "/"
site_url: https://shara-portfolio.netlify.app

media_library:
  name: cloudinary
  config:
    cloud_name: "ittlbjso"
    api_key: "737259485678325"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "portfolio"
        label: "Images"
        file: "content/pages/portfolio.md"
        fields:
          - name: "images"
            label: "Gallery images"
            widget: "list"
            required: false
            hint: "Upload multiple images, then drag them into the order used on the homepage."
            summary: "{{fields.image}}"
            fields:
              - name: "image"
                label: "Image"
                widget: "image"
                choose_url: true
                required: true
                media_library:
                  config:
                    multiple: true
